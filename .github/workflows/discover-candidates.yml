name: Weekly candidate discovery

on:
  schedule:
    # Sundays 22:00 UTC (Mon 06:00 in Taiwan) — finishes before user wakes
    - cron: "0 22 * * 0"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Discover candidates from PTT + Google News
        run: npm run discover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_OPTIONS: --no-warnings

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/candidates)" ]; then
            git add data/candidates
            git commit -m "chore(data): weekly candidate discovery"
            git push
          else
            echo "No new candidates."
          fi
